name: Build CI

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'Directory.Build.props'
      - '.github/workflows/build-ci.yml'
      - 'SonarQube.Analysis.xml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '*.slnx'
      - 'Directory.Build.props'
      - 'SonarQube.Analysis.xml'
      - '.github/workflows/build-ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: BeeTest_Password123!
        ports:
          - 1433:1433

      postgresql:
        image: postgres:17
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: common
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: BeeTest_Password123!
          MYSQL_DATABASE: common
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pBeeTest_Password123!"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Oracle 23ai Free，對齊本機 .runsettings 的 FREEPDB1 service name。
      # gvenzl/oracle-free 是社群維護的事實標準；faststart 版預先建好 DB，
      # 啟動時間 45~90s（image ~1.5GB）。pin digest 對應 tag :23-slim-faststart，
      # 詳見 docs/plans/plan-oracle-main-ci-evaluation.md。
      oracle:
        image: gvenzl/oracle-free@sha256:c9803db54238b5be268c7f5916e3c5811ef106e58aeb2f1f9b690c135ed50672
        env:
          ORACLE_PASSWORD: BeeTest_Password123!
          APP_USER: testuser
          APP_USER_PASSWORD: testpass
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 20s
          --health-timeout 10s
          --health-retries 30
          --health-start-period 60s

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Setup Java (for SonarScanner)
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
      with:
        distribution: zulu
        java-version: '17'

    - name: Cache SonarCloud packages
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarScanner for .NET
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Install sqlcmd
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc > /dev/null
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list > /dev/null
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
        echo "/opt/mssql-tools18/bin" >> $GITHUB_PATH

    - name: Wait for SQL Server
      env:
        SA_PASSWORD: BeeTest_Password123!
      run: |
        for i in {1..60}; do
          if /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server ready after ${i} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "SQL Server did not become ready in time" >&2
        exit 1

    - name: Create test databases (common + company + log)
      env:
        SA_PASSWORD: BeeTest_Password123!
        MYSQL_ROOT_PASSWORD: BeeTest_Password123!
        PGPASSWORD: testpass
      run: |
        # SQL Server：sa 可建任何 DB
        /opt/mssql-tools18/bin/sqlcmd -S localhost,1433 -U sa -P "$SA_PASSWORD" -C -Q \
          "IF DB_ID('common') IS NULL CREATE DATABASE common; IF DB_ID('company') IS NULL CREATE DATABASE company; IF DB_ID('log') IS NULL CREATE DATABASE log;"
        # PostgreSQL：service container 已建 common；補建 company + log（testuser 為 superuser）
        psql -h 127.0.0.1 -U testuser -d postgres -c \
          "SELECT 1 FROM pg_database WHERE datname='company'" | grep -q '1 row' || \
          psql -h 127.0.0.1 -U testuser -d postgres -c 'CREATE DATABASE company OWNER testuser'
        psql -h 127.0.0.1 -U testuser -d postgres -c \
          "SELECT 1 FROM pg_database WHERE datname='log'" | grep -q '1 row' || \
          psql -h 127.0.0.1 -U testuser -d postgres -c 'CREATE DATABASE log OWNER testuser'
        # MySQL：service container 已建 common；補建 company + log + grant testuser（需 root）
        mysql -h 127.0.0.1 -u root -p"$MYSQL_ROOT_PASSWORD" -e \
          "CREATE DATABASE IF NOT EXISTS company; \
           CREATE DATABASE IF NOT EXISTS log; \
           GRANT ALL PRIVILEGES ON company.* TO 'testuser'@'%'; \
           GRANT ALL PRIVILEGES ON log.* TO 'testuser'@'%'; \
           FLUSH PRIVILEGES;"

    # Strict build（analyzer gate）：未經 SonarScanner 包覆，TreatWarningsAsErrors
    # 與 .editorconfig 的 analyzer 規則會真正擋 build。Sonar-wrapped build 會削弱
    # 這層保護，故獨立跑一次把關。
    - name: Strict build (analyzer gate)
      run: dotnet build Bee.Library.slnx --configuration Release

    - name: SonarScanner Begin
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet sonarscanner begin \
          /k:"jeff377_bee-library" \
          /o:"jeff377" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /s:"$GITHUB_WORKSPACE/SonarQube.Analysis.xml"

    - name: Build (for Sonar coverage)
      run: dotnet build Bee.Library.slnx --configuration Release --no-incremental

    - name: Test with coverage
      env:
        # {@DbName} 由 SharedDatabaseState 為每個 DatabaseItem 代換成 common / company，
        # 對應上一步預建的兩個實體資料庫；Oracle 例外（不走 DbName 區隔）。
        BEE_TEST_CONNSTR_SQLSERVER: "Server=localhost,1433;Database={@DbName};User Id=sa;Password=BeeTest_Password123!;Encrypt=True;TrustServerCertificate=True;"
        BEE_TEST_CONNSTR_POSTGRESQL: "Host=localhost;Port=5432;Database={@DbName};Username=testuser;Password=testpass"
        BEE_TEST_CONNSTR_MYSQL: "Server=localhost;Port=3306;Database={@DbName};User=testuser;Password=testpass;"
        BEE_TEST_CONNSTR_ORACLE: "Data Source=localhost:1521/FREEPDB1;User Id=testuser;Password=testpass;"
        # SQLite is a pure driver with no service container — in-memory shared cache so
        # multiple connections see the same database (cache=shared) and there is no IO
        # to clean up between runs. Each {@DbName} substitution maps to an independent
        # in-memory DB (bee_test_common / bee_test_company / …).
        BEE_TEST_CONNSTR_SQLITE: "Data Source=file:bee_test_{@DbName}?mode=memory&cache=shared"
      run: dotnet test Bee.Library.slnx --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage;Format=opencover"

    - name: SonarScanner End
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

    - name: Pack NuGet packages (驗證用，不推送)
      run: |
        dotnet pack src/Bee.Base/Bee.Base.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Expressions/Bee.Expressions.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Definition/Bee.Definition.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.ObjectCaching/Bee.ObjectCaching.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Db/Bee.Db.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Business/Bee.Business.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Api.Client/Bee.Api.Client.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Api.Contracts/Bee.Api.Contracts.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Api.Core/Bee.Api.Core.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Hosting/Bee.Hosting.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Api.AspNetCore/Bee.Api.AspNetCore.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Repository.Abstractions/Bee.Repository.Abstractions.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Repository/Bee.Repository.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.UI.Core/Bee.UI.Core.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.UI.Avalonia/Bee.UI.Avalonia.csproj --configuration Release --output ./nupkgs --no-build
        dotnet pack src/Bee.Web.Blazor.Server/Bee.Web.Blazor.Server.csproj --configuration Release --output ./nupkgs --no-build

    # Mobile AOT gate：`DynamicCodeSupport=false` 正是 .NET for iOS SDK 對每個
    # iOS / tvOS / MacCatalyst 建置設定的值，映射為
    # `RuntimeFeature.IsDynamicCodeSupported` 的 RuntimeHostConfigurationOption。
    # 少了這一關，「wire 型別忘了註冊 formatter」在桌面上完全無感（contractless 會接手），
    # 到行動端才會以 FormatterNotRegisteredException 現形。
    # 需重新建置（runtimeconfig 不同），故不加 --no-build，並放在 job 最後一步，
    # 避免污染前面 --no-build 步驟的輸出。
    # 涵蓋兩半：MessagePack wire（Bee.Api.Core）與 XmlSerializer 的 reflection-only 路徑
    # （Bee.Definition / Bee.Base）。後者先前不在閘門內，而它正是已實際踩過的那一類 ——
    # LanguageEnum.Entries 的 get-only setter 缺陷（5e748b08）就是靠人工掃描發現，不是靠 CI。
    #
    # 已知盲區：本關卡跑在 CoreCLR，而 MakeGenericType / MakeGenericMethod 不受該開關影響。
    # ADR-037 要求註冊封閉泛型具現的理由正是 MakeGenericType，所以那一類失敗由
    # WireContractDriftTests 的靜態閉包負責，兩道各管一半、缺一不可。
    - name: Mobile AOT gate (wire + XmlSerializer reflection-only path)
      env:
        BEE_TEST_CONNSTR_SQLSERVER: "Server=localhost,1433;Database={@DbName};User Id=sa;Password=BeeTest_Password123!;Encrypt=True;TrustServerCertificate=True;"
        BEE_TEST_CONNSTR_POSTGRESQL: "Host=localhost;Port=5432;Database={@DbName};Username=testuser;Password=testpass"
        BEE_TEST_CONNSTR_MYSQL: "Server=localhost;Port=3306;Database={@DbName};User=testuser;Password=testpass;"
        BEE_TEST_CONNSTR_ORACLE: "Data Source=localhost:1521/FREEPDB1;User Id=testuser;Password=testpass;"
        BEE_TEST_CONNSTR_SQLITE: "Data Source=file:bee_test_{@DbName}?mode=memory&cache=shared"
      run: |
        for proj in \
          tests/Bee.Api.Core.UnitTests/Bee.Api.Core.UnitTests.csproj \
          tests/Bee.Definition.UnitTests/Bee.Definition.UnitTests.csproj \
          tests/Bee.Base.UnitTests/Bee.Base.UnitTests.csproj
        do
          dotnet test "$proj" --configuration Release --verbosity normal -p:DynamicCodeSupport=false
        done
