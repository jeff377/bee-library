name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'  # 只有推送 tag（例如 v1.2.3）時才會觸發

jobs:
  publish:
    runs-on: windows-latest

    outputs:
      # The package list for the release body. Derived from what was actually pushed rather
      # than hand-written, so it cannot drift from the pack step the way a third copy would.
      packages: ${{ steps.pkgs.outputs.PACKAGES }}

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

    - name: Setup .NET
      uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7  # v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Extract version from tag
      id: version
      run: |
        $tag = "${{ github.ref_name }}"
        $version = $tag.TrimStart('v')
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Host "Publishing version: $version"

    - name: Restore dependencies
      run: |
        dotnet restore Bee.Library.slnx
        # tools/Bee.Cli is not part of Bee.Library.slnx (tools live in Bee.Tools.slnx);
        # restore it explicitly so the subsequent build --no-restore step works.
        dotnet restore tools/Bee.Cli/Bee.Cli.csproj

    - name: Build all projects
      run: |
        $ErrorActionPreference = 'Stop'
        $ver = "${{ steps.version.outputs.VERSION }}"
        dotnet build src/Bee.Base/Bee.Base.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Definition/Bee.Definition.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.ObjectCaching/Bee.ObjectCaching.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Db/Bee.Db.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Business/Bee.Business.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Api.Client/Bee.Api.Client.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.UI.Core/Bee.UI.Core.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.UI.Avalonia/Bee.UI.Avalonia.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Api.Contracts/Bee.Api.Contracts.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Api.Core/Bee.Api.Core.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Hosting/Bee.Hosting.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Api.AspNetCore/Bee.Api.AspNetCore.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Repository.Abstractions/Bee.Repository.Abstractions.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Repository/Bee.Repository.csproj --configuration Release --no-restore /p:Version=$ver
        dotnet build src/Bee.Web.Blazor.Server/Bee.Web.Blazor.Server.csproj --configuration Release --no-restore /p:Version=$ver
        # Framework CLI (dotnet tool) — lock-stepped to framework version.
        dotnet build tools/Bee.Cli/Bee.Cli.csproj --configuration Release --no-restore /p:Version=$ver

    - name: Pack NuGet packages
      run: |
        $ErrorActionPreference = 'Stop'
        $ver = "${{ steps.version.outputs.VERSION }}"
        dotnet pack src/Bee.Base/Bee.Base.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Expressions/Bee.Expressions.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Definition/Bee.Definition.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.ObjectCaching/Bee.ObjectCaching.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Db/Bee.Db.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Business/Bee.Business.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Api.Client/Bee.Api.Client.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.UI.Core/Bee.UI.Core.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.UI.Avalonia/Bee.UI.Avalonia.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Api.Contracts/Bee.Api.Contracts.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Api.Core/Bee.Api.Core.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Hosting/Bee.Hosting.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Api.AspNetCore/Bee.Api.AspNetCore.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Repository.Abstractions/Bee.Repository.Abstractions.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Repository/Bee.Repository.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        dotnet pack src/Bee.Web.Blazor.Server/Bee.Web.Blazor.Server.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver
        # Framework CLI (dotnet tool).
        dotnet pack tools/Bee.Cli/Bee.Cli.csproj --configuration Release --output ./nupkgs --no-build /p:Version=$ver

    - name: Push to NuGet
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem -Path ./nupkgs -Filter *.nupkg | ForEach-Object {
          dotnet nuget push $_.FullName --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw "Failed to push $($_.Name)" }
        }

    - name: Collect published packages
      id: pkgs
      env:
        VER: ${{ steps.version.outputs.VERSION }}
      run: |
        $ErrorActionPreference = 'Stop'
        # Extension is compared explicitly rather than passed to -Filter, because the Windows
        # filter matches on the 8.3 short name as well and would also return the .snupkg files.
        $lines = Get-ChildItem -Path ./nupkgs |
          Where-Object { $_.Extension -eq '.nupkg' } |
          ForEach-Object { $_.Name -replace "\.$([regex]::Escape($env:VER))\.nupkg$", '' } |
          Sort-Object -Unique |
          ForEach-Object { "- [$_](https://www.nuget.org/packages/$_/$env:VER)" }
        if (-not $lines) { throw "No packages found in ./nupkgs" }
        "PACKAGES<<PKGEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        $lines | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "PKGEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Published $($lines.Count) packages."

  release:
    needs: publish  # 確保 NuGet 全數發佈成功後才建立 GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      with:
        fetch-depth: 0  # the previous tag is needed for the compare link

    - name: Extract version from tag
      id: version
      run: |
        TAG="${{ github.ref_name }}"
        echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

    - name: Resolve compare link
      id: compare
      run: |
        TAG="${{ github.ref_name }}"
        PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
        if [ -n "$PREV" ]; then
          echo "URL=https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}" >> $GITHUB_OUTPUT
        else
          # First tag in the repository: there is nothing to compare against.
          echo "URL=https://github.com/${{ github.repository }}/commits/${TAG}" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          NuGet packages for version ${{ steps.version.outputs.VERSION }} have been published.

          Release notes:
          - [English](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/changelogs/${{ steps.version.outputs.VERSION }}.md)
          - [繁體中文](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/changelogs/${{ steps.version.outputs.VERSION }}.zh-TW.md)

          ### Packages in this release

          ${{ needs.publish.outputs.packages }}

          > `Bee.Cli` is a .NET tool and installs differently from the libraries above:
          > `dotnet tool install -g Bee.Cli --version ${{ steps.version.outputs.VERSION }}`

          **Full Changelog**: ${{ steps.compare.outputs.URL }}
